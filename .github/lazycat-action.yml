version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/claper.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: claper-app

build:
  run_buildscript: false

images:
  # 上游有完整三段 SemVer tag（2.3.1/2.3.2/3.0.0），regex 排除一段/两段式与 latest/dev/main
  - id: claper-app
    target: service
    service: claper-app
    source: ghcr.io/claperco/claper
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
  # postgres 辅助镜像：跟踪固定 15.x patch 家族，避开可变的 major tag 15
  - id: claper-db
    target: service
    service: claper-db
    source: library/postgres
    channel: custom
    sort: semver
    tag_regex: '^15\.\d+$'
    version_regex: '^(?P<version>15\.\d+)$'
    version_template: '{version}.0'
    delivery:
      mode: mirror

stores:
  official:
    # Official store publication is intentionally disabled; publish only to Miaomiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Claper
    summary: "The ultimate tool to interact with your audience."
