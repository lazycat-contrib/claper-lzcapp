application:
  subdomain: claper
  oidc_redirect_path: /users/oidc/callback
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://claper-app:4000/
services:
  claper-db:
    # upstream: library/postgres:15.20
    image: docker.1ms.run/library/postgres:15.20
    environment:
      - POSTGRES_PASSWORD={{ stable_secret "db_password" }}
      - POSTGRES_USER=claper
      - POSTGRES_DB=claper
    binds:
      - /lzcapp/var/data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -q -d claper -U claper
  claper-app:
    # upstream: ghcr.io/claperco/claper:3.3.0
    image: ghcr.1ms.run/claperco/claper:3.3.0
    environment:
      - BASE_URL=https://{{.S.AppDomain}}
      - DATABASE_URL=postgres://claper:{{ stable_secret "db_password" }}@claper-db:5432/claper
      - SECRET_KEY_BASE={{ stable_secret "secret_key_base" }}
      - PRESENTATION_STORAGE=local
      - PRESENTATION_STORAGE_DIR=/app/uploads
      - MAIL_TRANSPORT=local
      - MAIL_FROM=noreply@claper.co
      - MAIL_FROM_NAME=lazycat
    depends_on:
      - claper-db
    binds:
      - /lzcapp/var/uploads:/app/uploads
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail http://localhost:4000 || exit 1
      start_period: 20s
