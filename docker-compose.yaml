services:
  claper-db:
    image: postgres:15
    ports:
      - 5432:5432
    volumes:
      - "claper-db:/var/lib/postgresql/data"
    healthcheck:
      test:
        - CMD
        - pg_isready -q -d claper -U claper
      retries: 3
      timeout: 5s
    environment:
      POSTGRES_PASSWORD: claper
      POSTGRES_USER: claper
      POSTGRES_DB: claper
    networks:
      - claper-net
  claper-app:
    image: ghcr.io/claperco/claper:2.3.1
    ports:
      - 4000:4000
    volumes:
      - "claper-uploads:/app/uploads"
    healthcheck:
      test: curl --fail http://localhost:4000 || exit 1
      retries: 3
      start_period: 20s
      timeout: 5s
    environment:
      BASE_URL: http://localhost:4000
      # SAME_SITE_COOKIE=Lax
      # SECURE_COOKIE=false
      DATABASE_URL: postgres://claper:claper@claper-db:5432/claper
      SECRET_KEY_BASE: 0LZiQBLw4WvqPlz6cz8RsHJlxNiSqM9B48y4ChyJ5v2oA0L/TPIqRjQNdPZN3iEG
      # Generate with `mix phx.gen.secret`
      # ⚠️ Don't use this exact value for SECRET_KEY_BASE or someone would be able to sign a cookie with user_id=1 and log in as the admin!
      # Storage configuration
      PRESENTATION_STORAGE: local
      PRESENTATION_STORAGE_DIR: /app/uploads
      #MAX_FILE_SIZE_MB=15
      #AWS_ACCESS_KEY_ID=xxx
      #AWS_SECRET_ACCESS_KEY=xxx
      #AWS_REGION=eu-west-3
      #AWS_PRES_BUCKET=xxx

      # Mail configuration
      MAIL_TRANSPORT: local
      MAIL_FROM: noreply@claper.co
      MAIL_FROM_NAME:
    depends_on:
      db:
        condition: service_healthy
    networks:
      - claper-net

volumes:
  claper-db:
    driver: local
  claper-uploads:
    driver: local

networks:
  claper-net:
    driver: bridge
